[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "planilia-web"
version = "0.1.0"
description = "Geração de site estático a partir do mostruário de preços"
requires-python = ">=3.11"
dependencies = [
    "openpyxl>=3.1,<4",
]

[tool.setuptools]
py-modules = []

[tool.ruff]
target-version = "py311"
line-length = 100
